    <style>
      :root {
        --nemo-fg: #eef4f6;
        --nemo-fg-soft: #ced7dc;
        --nemo-fg-mute: #a8b3ba;
        --nemo-fg-dim: #8992a0;
        --nemo-bg: #04070a;
        --nemo-accent: #c0a88c;
      }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--nemo-bg); overflow: hidden;
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      main, h1, p { margin: 0; padding: 0; }

      .nemo-stage { position: fixed; inset: 0; overflow: hidden; }
      #nemo-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      .nemo-scrim {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to bottom,
          rgba(4, 8, 12, 0.6) 0%, rgba(4, 8, 12, 0.22) 30%,
          rgba(4, 8, 12, 0) 55%, rgba(4, 8, 12, 0.3) 85%, rgba(4, 8, 12, 0.65) 100%);
      }
      .nemo-copy {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; padding-top: 6vh; pointer-events: none; text-align: center; z-index: 6;
      }
      .nemo-404 {
        font-weight: 700; letter-spacing: 0.02em; line-height: 0.9;
        font-size: clamp(120px, 23vw, 340px); color: var(--nemo-fg);
        text-shadow: 0 0 120px rgba(0,0,0,0.75), 0 0 60px rgba(120,160,180,0.22), 0 6px 40px rgba(0,0,0,0.95);
      }
      .nemo-headline {
        margin: 18px 0 0; font-weight: 500; letter-spacing: 0.42em; text-transform: uppercase;
        font-size: clamp(15px, 2vw, 26px); color: var(--nemo-fg-soft); padding-left: 0.42em;
        text-shadow: 0 0 40px rgba(0,0,0,0.85), 0 2px 20px rgba(0,0,0,0.95);
      }
      .nemo-sub {
        margin: 14px 0 0; font-style: italic; font-weight: 300; font-size: clamp(13px, 1.4vw, 17px);
        color: var(--nemo-fg-mute); letter-spacing: 0.04em;
        text-shadow: 0 0 30px rgba(0,0,0,0.85), 0 2px 16px rgba(0,0,0,0.95);
      }
      .nemo-coords {
        margin: 24px 0 0; font-weight: 400; font-size: clamp(12px, 1.15vw, 15px);
        letter-spacing: 0.34em; color: var(--nemo-fg-dim);
        text-shadow: 0 0 26px rgba(0,0,0,0.85), 0 2px 14px rgba(0,0,0,0.95);
      }
      .nemo-foot { position: absolute; left: 0; right: 0; bottom: 5.5vh; display: flex; justify-content: center; z-index: 6; }
      .nemo-cta {
        pointer-events: auto; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
        font-size: 13px; color: var(--nemo-fg); text-decoration: none; padding: 13px 30px;
        border: 1px solid rgba(180, 195, 205, 0.4); border-radius: 2px;
        background: rgba(6, 12, 18, 0.55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        transition: border-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
      }
      .nemo-cta:hover, .nemo-cta:focus-visible {
        border-color: var(--nemo-accent); color: #fff; background: rgba(14, 24, 36, 0.65); outline: none;
      }
      .nemo-cta:focus-visible { outline: 2px solid var(--nemo-accent); outline-offset: 3px; }

      @media (prefers-reduced-motion: reduce) {
        #nemo-video { display: none; }
        .nemo-stage { background: var(--nemo-bg) url("assets/video/point-nemo-poster.jpg") center / cover no-repeat; }
      }
    </style>
  </head>
  <body>
    <main class="nemo-stage">
      <video id="nemo-video" autoplay loop muted playsinline preload="metadata"
        poster="assets/video/point-nemo-poster.jpg" aria-hidden="true">
        <source src="https://github.com/Nlefterova/Houseboat-website/releases/download/nemo-video-v1/point-nemo-loop.mp4" type="video/mp4" />
      </video>
      <div class="nemo-scrim" aria-hidden="true"></div>

      <div class="nemo-copy">
        <h1 class="nemo-404" aria-label="Ошибка 404">404</h1>
        <p class="nemo-headline">Вы достигли точки Немо</p>
        <p class="nemo-sub">самая отдалённая точка мирового океана</p>
        <p class="nemo-coords" aria-label="Координаты: 48 градусов 52.6 минут южной широты, 123 градуса 23.6 минут западной долготы">
          48°52.6′ Ю.Ш. &nbsp;·&nbsp; 123°23.6′ З.Д.
        </p>
      </div>

      <div class="nemo-foot">
        <a href="/" class="nemo-cta">Вернуться в гавань</a>
      </div>
    </main>
  </body>
